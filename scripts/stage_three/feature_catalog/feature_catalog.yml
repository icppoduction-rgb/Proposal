    features:
      - name: "dns_suspicious_tunnel_score"
        dtype: "numeric"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "zero"
          scaling: "minmax"
          encoding: "none"
  host_syscall:
    branch: "host"
    level: "sequence"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["event_order", "features_json"]
        output_features: ["host_syscall_frequency_vector"]
    features:
      - name: "host_syscall_frequency_vector"
        dtype: "numeric_vector"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "zero"
          scaling: "none"
          encoding: "none"
  host_process:
    branch: "host"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
