        nullable: true
        allow_in_X: true
        preprocessing:
          missing: "median"
          scaling: "standard"
          encoding: "none"
  host_logs:
    branch: "host"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["features_json", "raw_fields_json"]
        output_features: ["host_log_severity"]
    features:
      - name: "host_log_severity"
        dtype: "categorical"
        nullable: true
        allow_in_X: true
        preprocessing:
          missing: "unknown"
          scaling: "none"
          encoding: "ordinal"
  host_windows_sysmon:
    branch: "host"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["features_json", "process"]
        output_features: ["host_sysmon_event_id"]
    features:
      - name: "host_sysmon_event_id"
        dtype: "categorical"
