version: "1.0"
project: "Proposal"
stage: "stage-three"
owner: "stage-three"
source_document: "planning/stage-three/STAGE THREE(Feature Extraction, Preprocessing and Model-Ready Dataset Preparation).txt"
forbidden_X_columns:
  - "dataset_id"
  - "dataset_name"
  - "dataset_role"
  - "event_uid"
  - "file_id"
  - "label_*"
  - "label_binary"
  - "label_confidence"
  - "label_family"
  - "label_mapping_rule_id"
  - "label_source"
  - "label_status"
  - "label_subtype"
  - "metadata_json"
  - "normalized_artifact_id"
  - "parser_name"
  - "parser_run_id"
  - "parser_version"
  - "raw_fields_json"
  - "scenario_name"
  - "source_file"
  - "source_file_id"
  - "source_file_path"
  - "source_path"
feature_groups:
  dns_lexical:
    branch: "dns"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["domain", "features_json"]
        output_features: ["dns_query_length"]
    features:
      - name: "dns_query_length"
        dtype: "integer"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "zero"
          scaling: "standard"
          encoding: "none"
  dns_entropy:
    branch: "dns"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["domain", "features_json"]
        output_features: ["dns_query_entropy"]
    features:
      - name: "dns_query_entropy"
        dtype: "numeric"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "median"
          scaling: "standard"
          encoding: "none"
  dns_temporal:
    branch: "dns"
    level: "window"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["event_timestamp", "event_order", "domain"]
        output_features: ["dns_queries_per_window"]
    features:
      - name: "dns_queries_per_window"
        dtype: "integer"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "zero"
          scaling: "robust"
          encoding: "none"
  dns_protocol:
    branch: "dns"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["features_json", "raw_fields_json"]
        output_features: ["dns_response_code"]
    features:
      - name: "dns_response_code"
        dtype: "categorical"
        nullable: true
        allow_in_X: true
        preprocessing:
          missing: "unknown"
          scaling: "none"
          encoding: "one_hot"
  dns_window:
    branch: "dns"
    level: "window"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["event_timestamp", "domain", "src_ip"]
        output_features: ["dns_unique_domains_per_window"]
    features:
      - name: "dns_unique_domains_per_window"
        dtype: "integer"
        nullable: false
        allow_in_X: true
        preprocessing:
          missing: "zero"
          scaling: "standard"
          encoding: "none"
  dns_exfil_indicators:
    branch: "dns"
    level: "window"
    enabled: true
    planned: true
    extractor_mappings:
      - source_fields: ["domain", "features_json"]
