    features:
      - name: "host_auth_failure_flag"
        dtype: "boolean"
        nullable: true
        allow_in_X: true
        preprocessing:
          missing: "false"
          scaling: "none"
          encoding: "boolean"
  host_file_access:
    branch: "host"
    level: "event"
    enabled: true
    planned: true
    extractor_mappings:
